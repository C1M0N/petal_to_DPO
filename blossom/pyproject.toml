[project]
name = "blossom"
version = "0.1.0"
description = "花书（Goodfellow Deep Learning）交互式 Jupyter 学习项目"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cimon Peng" }
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "scikit-learn>=1.4",
]

[tool.uv]
dev-dependencies = [
    "nbformat>=5.10",
]
