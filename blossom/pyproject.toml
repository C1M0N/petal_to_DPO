[project]
name = "blossom"
version = "0.1.0"
description = "花书（Goodfellow Deep Learning）交互式 Jupyter 学习项目"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cimon Peng" }
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",        # Ch 3 起：scipy.stats 的 PMF/PDF/CDF/entropy
    "networkx>=3.0",      # Ch 3 §3：图模型可视化
    "pgmpy>=0.1.25",      # Ch 3 §3：贝叶斯网 + 马尔可夫网
]

[tool.uv]
dev-dependencies = [
    "nbformat>=5.10",
]
